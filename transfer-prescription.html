<!DOCTYPE html>
<html>
<head>
  <title>Transfer Prescription - Raees Pharmacy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: Arial; padding:20px;}
    input, textarea {width:100%; padding:10px; margin:8px 0;}
    button {background:#16a34a;color:white;padding:12px;border:none;border-radius:8px;}
  </style>
</head>
<body>

<h2>Transfer Your Prescription</h2>

<form>
  <input placeholder="Full Name" required>
  <input placeholder="Date of Birth" required>
  <input placeholder="Phone Number" required>
  <input placeholder="Current Pharmacy Name">
  <input placeholder="Pharmacy Phone">
  <textarea placeholder="Medication Name"></textarea>

  <button type="submit">Submit Request</button>
</form>

</body>
</html>
