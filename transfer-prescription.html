<!DOCTYPE html>
<html>
<head>
  <title>Transfer Prescription - Raees Pharmacy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: Arial; padding:20px;}
    input, textarea {width:100%; padding:10px; margin:8px 0;}
    button {background:#16a34a;color:white;padding:12px;border:none;border-radius:8px;}
  </style>
</head>
<body>

<h2>Transfer Your Prescription</h2>

<form action="https://formspree.io/f/xpqkddgv" method="POST">
  <input type="hidden" name="_subject" value="New Prescription Transfer - Raees Pharmacy">

  <input type="text" name="full_name" placeholder="Full Name" required>
  <input type="text" name="dob" placeholder="Date of Birth" required>
  <input type="text" name="phone" placeholder="Phone Number" required>
  <input type="text" name="current_pharmacy" placeholder="Current Pharmacy Name">
  <input type="text" name="pharmacy_phone" placeholder="Pharmacy Phone">
  <textarea name="medication_name" placeholder="Medication Name"></textarea>

  <button type="submit">Submit Request</button>
</form>

</body>
</html>
